name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test (unit, API and PostgreSQL integration tests)
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t management-app .
