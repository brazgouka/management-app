services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: management
      POSTGRES_USER: management
      POSTGRES_PASSWORD: management
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U management -d management"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/management
      DB_USERNAME: management
      DB_PASSWORD: management
    ports:
      - "8080:8080"

volumes:
  db-data:
