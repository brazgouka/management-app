spring:
  application:
    name: management-app
  # Zero-setup default: in-memory H2 in PostgreSQL mode. Use the "postgres" profile for a real database.
  datasource:
    url: jdbc:h2:mem:management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

app:
  demo-data:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
